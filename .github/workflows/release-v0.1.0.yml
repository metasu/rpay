name: Publish release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Block embedded credentials
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          findings = []
          files = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          provider = re.compile(rb'(?:sk_(?:live|test)|whsec)_[A-Za-z0-9]{16,}')
          private_blob = re.compile(rb'"[A-Za-z0-9+/]{800,}={0,2}"')
          database_url = re.compile(rb'mysql://[^\s:@/]+:([^\s@/]+)@')
          placeholders = {b'YOUR_PASSWORD', '你的数据库密码'.encode(), '密码'.encode()}

          for raw in files:
              if not raw:
                  continue
              path = Path(raw.decode())
              data = path.read_bytes()
              if provider.search(data):
                  findings.append(f"{path}: provider credential-shaped value")
              if private_blob.search(data):
                  findings.append(f"{path}: embedded private-key-shaped Base64")
              for match in database_url.finditer(data):
                  if match.group(1) not in placeholders:
                      findings.append(f"{path}: database URL has non-placeholder password")

          if findings:
              print("Release blocked by credential scan:")
              print("\n".join(sorted(set(findings))))
              raise SystemExit(1)
          print("Credential scan passed.")

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          package=rpay-v0.1.0-linux-x86_64
          mkdir -p "dist/$package/bin" "dist/$package/config" "dist/$package/database" "dist/$package/secrets"
          install -m 0755 target/release/rpay "dist/$package/bin/rpay"
          install -m 0644 README.md DEPLOY.md "dist/$package/"
          install -m 0644 config/config.example.toml "dist/$package/config/"
          install -m 0644 database/schema.sql database/seed.sql "dist/$package/database/"
          install -m 0644 secrets/database-url.example "dist/$package/secrets/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          sha256sum "dist/$package.tar.gz" > "dist/$package.tar.gz.sha256"

      - name: Tag
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a v0.1.0 -m "rpay v0.1.0"
          git push origin v0.1.0

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 \
            dist/rpay-v0.1.0-linux-x86_64.tar.gz \
            dist/rpay-v0.1.0-linux-x86_64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "rpay v0.1.0" \
            --notes "First versioned rpay release. Supports Alipay, WeChat Pay V2/V3, PayPal and Stripe, including Stripe Card + Alipay Checkout and privacy-minimized Stripe/PayPal checkout names.\n\nSecurity: no production database URL, administrator credential, merchant key, provider secret, webhook secret, or static private-key fixture is included. Provider examples are empty or explicit placeholders; seeded channels are disabled by default.\n\nThe Linux x86_64 archive includes the binary, deployment documentation, database schema, non-sensitive seed data, and example configuration. Verify it with the attached SHA-256 file."
